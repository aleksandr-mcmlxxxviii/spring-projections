spring:
  datasource:
    url: jdbc:tc:postgresql:17-alpine:///testdb
    username: test
    password: test
  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect
  liquibase:
    enabled: false  # Отключаем Liquibase для тестов

logging:
  level:
    org.springframework.test: DEBUG
    com.mvc.springprojections: DEBUG
